name: Build and Deploy to Databricks

on:
  push:
    branches: [rewiring]
  workflow_dispatch:
    inputs:
      run_demo:
        description: Run the intentionally failing AutoHeal demo job
        required: false
        default: false
        type: boolean

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/v1.13.0/install.sh | sudo sh
          databricks -v

      - name: Verify Databricks auth
        run: |
          databricks auth describe
          databricks current-user me

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload configuration files to Volume
        run: |
          databricks fs cp config/config.json \
          dbfs:/Volumes/brazilian-e-commerce/bronze/raw_data/configs/config.json \
          --overwrite
          databricks fs cp config/bronze.json \
          dbfs:/Volumes/brazilian-e-commerce/bronze/raw_data/configs/bronze.json \
          --overwrite

      - name: Upload wheel to Volume
        run: |
          WHL_FILE=$(ls dist/*.whl | head -n 1)
          databricks fs cp "$WHL_FILE" \
          dbfs:/Volumes/brazilian-e-commerce/bronze/raw_data/builds/ \
          --overwrite

      - name: Validate self-healing demo bundle
        run: |
          databricks bundle validate

      - name: Deploy self-healing demo bundle
        run: |
          databricks bundle deploy

      - name: Trigger self-healing demo job
        if: github.event_name == 'workflow_dispatch' && inputs.run_demo == true
        run: |
          databricks bundle run brazilian_self_healing_demo

      - name: Deploy Databricks job
        run: |
          databricks jobs reset --json @databricks_reset_job.json

      - name: Trigger Databricks job
        run: |
          databricks jobs run-now ${{ secrets.DATABRICKS_JOB_ID }}
