[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazilian-data-er"
version = "0.1.2"
description = "Brazilian E-commerce Data Pipeline - Bronze, Silver, and Gold Layer Processing"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "pyspark>=3.0.0",
]

[project.scripts]
# Bronze layer entry point
bronze = "brazilian_data_er.bronze.bronze:main"

# AutoHeal test Silver tasks
silver-demo-customers = "brazilian_data_er.silver.demo_tasks:customers_main"
silver-demo-orders = "brazilian_data_er.silver.demo_tasks:orders_main"
silver-demo-quality-check = "brazilian_data_er.silver.demo_tasks:quality_check_main"

[tool.setuptools]
packages = [
    "brazilian_data_er",
    "brazilian_data_er.bronze",
    "brazilian_data_er.silver",
    "brazilian_data_er.utils"
]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.setuptools.package-dir]
"" = "src"
